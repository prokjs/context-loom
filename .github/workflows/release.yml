name: Build Windows download

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:windows
      - run: npm run smoke:exe
      - uses: actions/upload-artifact@v4
        with:
          name: context-loom-windows-x64
          path: release/*
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: context-loom-windows-x64
          path: release
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName; then
            echo "A release already exists for this tag; leaving its assets and publication state unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release/* --draft --title "Context Loom $RELEASE_TAG" --notes "Windows x64 standalone download. Download the exe; no Node.js installation is needed. The app opens in your browser and keeps a launcher window open. Local compilation is free; direct OpenAI API requests incur separate charges and require approval. This build is unsigned: Windows may warn about its unknown publisher. SHA256SUMS.txt and third-party runtime notices are included. Review before publishing."
